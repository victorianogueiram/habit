<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F4F4F7;
    --ink:#1B1B20;
    --ink-soft:#8A899A;
    --ink-faint:#C7C6D1;
    --accent:#F14C6D;
    --exercicio:#FF7A54;
    --exercicio-soft:#FFE4DA;
    --leitura:#4C7CF2;
    --leitura-soft:#DCE6FE;
    --agua:#8B6EF2;
    --agua-soft:#E7E1FE;
    --journaling:#2FB88F;
    --journaling-soft:#D8F3EB;
    --radius-xl:26px;
    --radius-lg:20px;
    --radius-md:14px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Manrope',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    overscroll-behavior:none;
  }

  #app{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 100px) 20px;
    position:relative;
  }

  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- Header ---------- */
  .header{ margin-bottom:22px; }
  .greeting{ font-size:26px; font-weight:800; letter-spacing:-0.02em; margin:0; color:var(--ink); }
  .greeting .accent{ color:var(--accent); }
  .date-line{ font-size:14px; color:var(--ink-soft); margin-top:4px; font-weight:600; text-transform:capitalize; }

  /* ---------- Day selector ---------- */
  .day-row{
    display:flex; justify-content:space-between; gap:6px;
    margin-bottom:24px;
  }
  .day-pill{
    flex:1;
    background:var(--surface);
    border-radius:16px;
    padding:10px 0 12px;
    text-align:center;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .day-pill:active{ transform:scale(0.94); }
  .day-pill .dow{ display:block; font-size:10.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .day-pill .dom{ display:block; font-size:15px; font-weight:800; margin-top:4px; color:var(--ink); }
  .day-pill.today .dow{ color:rgba(255,255,255,.75); }
  .day-pill.today .dom{ color:#fff; }
  .day-pill.selected{ background:var(--accent); }
  .day-pill.selected .dow{ color:rgba(255,255,255,.75); }
  .day-pill.selected .dom{ color:#fff; }
  .day-pill.future{ opacity:.4; cursor:not-allowed; }

  /* ---------- Habit cards (Today) ---------- */
  .habit-list{ display:flex; flex-direction:column; gap:12px; }
  .habit-card{
    border-radius:var(--radius-lg);
    padding:16px 16px;
    display:flex; align-items:center; gap:14px;
    color:#fff;
  }
  .habit-icon{
    width:46px; height:46px; border-radius:14px;
    background:rgba(255,255,255,0.24);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .habit-icon svg{ width:23px; height:23px; }
  .habit-info{ flex:1; min-width:0; }
  .habit-name{ font-size:15.5px; font-weight:800; margin:0; }
  .habit-streak{ font-size:12.5px; color:rgba(255,255,255,.8); margin-top:2px; font-weight:600; }
  .check-btn{
    width:32px; height:32px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.55);
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    transition:all .15s ease;
  }
  .check-btn svg{ width:15px; height:15px; opacity:0; transition:opacity .12s ease; }
  .check-btn.checked{ background:#fff; border-color:#fff; }
  .check-btn.checked svg{ opacity:1; }
  .check-btn:active{ transform:scale(0.9); }

  .empty-note{
    margin-top:18px; font-size:13px; color:var(--ink-faint); text-align:center; font-weight:600;
  }

  /* ---------- Progress screen ---------- */
  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    padding:9px 16px;
    border-radius:999px;
    background:var(--surface);
    font-size:13px; font-weight:700; color:var(--ink-soft);
    cursor:pointer;
    display:flex; align-items:center; gap:7px;
    transition:background .15s ease, color .15s ease;
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; }
  .chip.active{ color:#fff; }

  .detail-card{
    border-radius:var(--radius-xl);
    padding:20px;
    color:#fff;
    margin-bottom:16px;
  }
  .detail-top{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .detail-icon{
    width:50px; height:50px; border-radius:15px;
    background:rgba(255,255,255,0.24);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .detail-icon svg{ width:25px; height:25px; }
  .detail-name{ font-size:17px; font-weight:800; margin:0; }
  .detail-badge{ font-size:12px; font-weight:700; color:rgba(255,255,255,.85); margin-top:2px; }

  .week-row{ display:flex; justify-content:space-between; margin-bottom:16px; }
  .week-day{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .week-day .wl{ font-size:10px; font-weight:700; color:rgba(255,255,255,.7); text-transform:uppercase; }
  .week-dot{
    width:26px; height:26px; border-radius:50%;
    background:rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center;
  }
  .week-dot.done{ background:#fff; }
  .week-dot.done svg{ width:12px; height:12px; }
  .week-dot.today-ring{ box-shadow:0 0 0 1.5px #fff; }

  .bar-track{ height:8px; border-radius:99px; background:rgba(255,255,255,0.22); overflow:hidden; }
  .bar-fill{ height:100%; background:#fff; border-radius:99px; transition:width .25s ease; }

  .stat-row{ display:flex; gap:10px; margin:16px 0; }
  .stat-card{
    flex:1; background:var(--surface);
    border-radius:var(--radius-md); padding:14px 14px;
  }
  .stat-num{ font-size:24px; font-weight:800; letter-spacing:-0.02em; color:var(--ink); }
  .stat-label{ font-size:11.5px; color:var(--ink-soft); font-weight:700; margin-top:2px; }

  .cal-card{
    background:var(--surface);
    border-radius:var(--radius-lg); padding:18px;
  }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-month{ font-size:14.5px; font-weight:800; color:var(--ink); text-transform:capitalize; }
  .cal-arrow{
    width:28px; height:28px; border-radius:50%; border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:#fff;
  }
  .cal-arrow svg{ width:12px; height:12px; }
  .cal-arrow.disabled{ opacity:.3; pointer-events:none; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow{ font-size:10px; font-weight:700; color:var(--ink-faint); text-align:center; padding-bottom:4px; }
  .cal-day{
    aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; color:var(--ink-faint);
    background:#fff;
  }
  .cal-day.done{ color:#fff; }
  .cal-day.today-outline{ box-shadow:inset 0 0 0 1.5px var(--ink); }
  .cal-day.empty{ background:transparent; }

  /* ---------- Bottom nav ---------- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center;
    padding: 14px 20px calc(env(safe-area-inset-bottom) + 14px);
    pointer-events:none;
  }
  .segmented{
    pointer-events:auto;
    display:flex; background:#1B1B20;
    border-radius:999px; padding:6px;
    box-shadow:0 10px 28px rgba(0,0,0,0.22);
    gap:4px;
  }
  .seg-btn{
    display:flex; align-items:center; gap:8px;
    border:none; background:transparent; color:#8A899A;
    font-family:inherit; font-size:14px; font-weight:700;
    padding:11px 20px; border-radius:999px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .seg-btn svg{ width:17px; height:17px; }
  .seg-btn.active{ background:#fff; color:var(--ink); }
</style>
</head>
<body>
<div id="app">

  <!-- ---------- TODAY SCREEN ---------- -->
  <div class="screen active" id="screen-today">
    <div class="header">
      <p class="greeting" id="greeting">Bom <span class="accent">dia</span></p>
      <p class="date-line" id="date-line"></p>
    </div>

    <div class="day-row" id="day-row"></div>

    <div class="habit-list" id="habit-list"></div>
    <p class="empty-note" id="future-note" style="display:none;">Ainda não chegou esse dia.</p>
  </div>

  <!-- ---------- PROGRESS SCREEN ---------- -->
  <div class="screen" id="screen-progress">
    <div class="header">
      <p class="greeting">Progr<span class="accent">esso</span></p>
      <p class="date-line">Streak, histórico e consistência</p>
    </div>

    <div class="chip-row" id="chip-row"></div>

    <div class="detail-card" id="detail-card">
      <div class="detail-top">
        <div class="detail-icon" id="detail-icon"></div>
        <div>
          <p class="detail-name" id="detail-name"></p>
          <p class="detail-badge" id="detail-badge"></p>
        </div>
      </div>

      <div class="week-row" id="week-row"></div>

      <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-current">0</div>
        <div class="stat-label">Streak atual</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-longest">0</div>
        <div class="stat-label">Recorde</div>
      </div>
    </div>

    <div class="cal-card">
      <div class="cal-nav">
        <button class="cal-arrow" id="cal-prev">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="#1B1B20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="cal-month" id="cal-month"></div>
        <button class="cal-arrow" id="cal-next">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="#1B1B20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>

  <!-- ---------- BOTTOM NAV ---------- -->
  <div class="tabbar">
    <div class="segmented">
      <button class="seg-btn active" data-tab="today">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10V19H18V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Hoje
      </button>
      <button class="seg-btn" data-tab="progress">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 19V13M12 19V6M19 19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Progresso
      </button>
    </div>
  </div>

</div>

<script>
/* ============ CONFIG ============ */
const HABITS = [
  { id:'exercicio',  name:'Exercício',  color:'var(--exercicio)', hex:'#FF7A54',
    icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M6.5 8.5L6.5 15.5M17.5 8.5V15.5M3 10.5V13.5M21 10.5V13.5M6.5 12H17.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>' },
  { id:'leitura',    name:'Leitura',    color:'var(--leitura)',   hex:'#4C7CF2',
    icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 6C10.3 4.7 7.8 4 5 4V17C7.8 17 10.3 17.7 12 19M12 6C13.7 4.7 16.2 4 19 4V17C16.2 17 13.7 17.7 12 19M12 6V19" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
  { id:'agua',       name:'2L de água', color:'var(--agua)',      hex:'#8B6EF2',
    icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 3C12 3 6 10.5 6 14.5C6 18.09 8.69 21 12 21C15.31 21 18 18.09 18 14.5C18 10.5 12 3 12 3Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>' },
  { id:'journaling', name:'Journaling',color:'var(--journaling)',hex:'#2FB88F',
    icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 20H8.5L18 10.5C18.8 9.7 18.8 8.4 18 7.6L17 6.6C16.2 5.8 14.9 5.8 14.1 6.6L4.6 16.1C4.2 16.5 4 17 4 17.6V20H5Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M12.5 8L16.5 12" stroke="#fff" stroke-width="1.6"/></svg>' },
];

const DOW_LETTERS = ['D','S','T','Q','Q','S','S']; // Dom Seg Ter Qua Qui Sex Sab
const DOW_SHORT   = ['dom','seg','ter','qua','qui','sex','sáb'];
const MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ============ STORAGE ============ */
const STORE_KEY = 'habit_tracker_checks_v1';

function loadChecks(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveChecks(data){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}
let checks = loadChecks(); // { "YYYY-MM-DD": { habitId: true } }

/* ============ DATE HELPERS ============ */
function toKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function startOfDay(d){ const c=new Date(d); c.setHours(0,0,0,0); return c; }
function isFuture(d){ return startOfDay(d) > startOfDay(new Date()); }
function isSameDay(a,b){ return toKey(a)===toKey(b); }

let selectedDate = startOfDay(new Date());
let progressViewMonth = new Date();
let activeHabitId = HABITS[0].id;

/* ============ TODAY SCREEN ============ */
function renderGreeting(){
  const h = new Date().getHours();
  const parts = h < 12 ? ['Bom','dia'] : h < 18 ? ['Boa','tarde'] : ['Boa','noite'];
  document.getElementById('greeting').innerHTML = `${parts[0]} <span class="accent">${parts[1]}</span>`;
  const opts = { weekday:'long', day:'numeric', month:'long' };
  document.getElementById('date-line').textContent =
    selectedDate.toLocaleDateString('pt-BR', opts);
}

function renderDayRow(){
  const row = document.getElementById('day-row');
  row.innerHTML = '';
  const today = startOfDay(new Date());
  const dow = today.getDay();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - dow);

  for(let i=0;i<7;i++){
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate()+i);
    const pill = document.createElement('div');
    pill.className = 'day-pill';
    if(isSameDay(d, today)) pill.classList.add('today');
    if(isSameDay(d, selectedDate)) pill.classList.add('selected');
    if(isFuture(d)) pill.classList.add('future');
    pill.innerHTML = `<span class="dow">${DOW_LETTERS[d.getDay()]}</span><span class="dom">${d.getDate()}</span>`;
    if(!isFuture(d)){
      pill.addEventListener('click', ()=>{
        selectedDate = startOfDay(d);
        renderToday();
      });
    }
    row.appendChild(pill);
  }
}

function computeCurrentStreak(habitId){
  let streak = 0;
  let d = startOfDay(new Date());
  const todayKey = toKey(d);
  const doneToday = !!(checks[todayKey] && checks[todayKey][habitId]);
  if(!doneToday) d.setDate(d.getDate()-1);
  while(true){
    const k = toKey(d);
    if(checks[k] && checks[k][habitId]){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function computeLongestStreak(habitId){
  const dates = Object.keys(checks).filter(k => checks[k][habitId]).sort();
  if(dates.length === 0) return 0;
  let longest = 1, current = 1;
  for(let i=1;i<dates.length;i++){
    const diffDays = Math.round((new Date(dates[i]) - new Date(dates[i-1])) / 86400000);
    current = diffDays === 1 ? current+1 : 1;
    longest = Math.max(longest, current);
  }
  return longest;
}

function renderHabitList(){
  const list = document.getElementById('habit-list');
  list.innerHTML = '';
  const key = toKey(selectedDate);
  const dayChecks = checks[key] || {};

  HABITS.forEach(h => {
    const card = document.createElement('div');
    card.className = 'habit-card';
    card.style.background = h.color;
    const isChecked = !!dayChecks[h.id];
    const streak = computeCurrentStreak(h.id);
    card.innerHTML = `
      <div class="habit-icon">${h.icon}</div>
      <div class="habit-info">
        <p class="habit-name">${h.name}</p>
        <p class="habit-streak">${streak > 0 ? streak + ' dia' + (streak>1?'s':'') + ' seguidos' : 'Sem streak ainda'}</p>
      </div>
      <button class="check-btn ${isChecked?'checked':''}" data-habit="${h.id}">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13L9.5 17.5L19 7" stroke="${h.hex}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.check-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const habitId = btn.dataset.habit;
      const k = toKey(selectedDate);
      if(!checks[k]) checks[k] = {};
      checks[k][habitId] = !checks[k][habitId];
      if(!checks[k][habitId]) delete checks[k][habitId];
      saveChecks(checks);
      renderHabitList();
      if(document.getElementById('screen-progress').classList.contains('active')) renderProgress();
    });
  });
}

function renderToday(){
  renderGreeting();
  renderDayRow();
  renderHabitList();
}

/* ============ PROGRESS SCREEN ============ */
function renderChips(){
  const row = document.getElementById('chip-row');
  row.innerHTML = '';
  HABITS.forEach(h=>{
    const chip = document.createElement('div');
    const active = h.id===activeHabitId;
    chip.className = 'chip' + (active ? ' active' : '');
    if(active) chip.style.background = h.color;
    chip.innerHTML = `<span class="dot" style="background:${active?'#fff':h.hex}"></span>${h.name}`;
    chip.addEventListener('click', ()=>{
      activeHabitId = h.id;
      renderProgress();
    });
    row.appendChild(chip);
  });
}

function renderDetailCard(){
  const habit = HABITS.find(h=>h.id===activeHabitId);
  const card = document.getElementById('detail-card');
  card.style.background = habit.color;
  document.getElementById('detail-icon').innerHTML = habit.icon;
  document.getElementById('detail-name').textContent = habit.name;

  const streak = computeCurrentStreak(habit.id);
  document.getElementById('detail-badge').textContent =
    streak > 0 ? `${streak} dia${streak>1?'s':''} seguidos` : 'Comece hoje';

  // week row: current week Sun-Sat
  const today = startOfDay(new Date());
  const dow = today.getDay();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate()-dow);
  const weekRow = document.getElementById('week-row');
  weekRow.innerHTML = '';
  let doneThisWeek = 0, elapsedThisWeek = 0;

  for(let i=0;i<7;i++){
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate()+i);
    const future = isFuture(d);
    const done = !!(checks[toKey(d)] && checks[toKey(d)][habit.id]);
    if(!future) elapsedThisWeek++;
    if(done) doneThisWeek++;

    const cell = document.createElement('div');
    cell.className = 'week-day';
    cell.innerHTML = `
      <span class="wl">${DOW_SHORT[d.getDay()][0]}</span>
      <div class="week-dot ${done?'done':''} ${isSameDay(d,today)?'today-ring':''}">
        ${done ? `<svg viewBox="0 0 24 24" fill="none"><path d="M5 13L9.5 17.5L19 7" stroke="${habit.hex}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}
      </div>
    `;
    weekRow.appendChild(cell);
  }

  const pct = elapsedThisWeek>0 ? Math.round((doneThisWeek/elapsedThisWeek)*100) : 0;
  document.getElementById('bar-fill').style.width = pct + '%';
}

function renderStats(){
  document.getElementById('stat-current').textContent = computeCurrentStreak(activeHabitId);
  document.getElementById('stat-longest').textContent = computeLongestStreak(activeHabitId);
}

function renderCalendar(){
  const year = progressViewMonth.getFullYear();
  const month = progressViewMonth.getMonth();
  document.getElementById('cal-month').textContent =
    `${MONTH_NAMES[month]} ${year}`;

  const today = startOfDay(new Date());
  const isCurrentMonth = (year===today.getFullYear() && month===today.getMonth());
  document.getElementById('cal-next').classList.toggle('disabled', isCurrentMonth);

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  DOW_LETTERS.forEach(l=>{
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = l;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  for(let i=0;i<startOffset;i++){
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  const habit = HABITS.find(h=>h.id===activeHabitId);

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const key = toKey(d);
    const done = !!(checks[key] && checks[key][activeHabitId]);
    const future = isFuture(d);

    const el = document.createElement('div');
    el.className = 'cal-day' + (done?' done':'') + (isSameDay(d, today)?' today-outline':'');
    if(done) el.style.background = habit.hex;
    if(future) el.style.opacity = '0.35';
    el.textContent = day;
    grid.appendChild(el);
  }
}

function renderProgress(){
  renderChips();
  renderDetailCard();
  renderStats();
  renderCalendar();
}

/* ============ NAV ============ */
document.querySelectorAll('.seg-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('screen-today').classList.toggle('active', tab==='today');
    document.getElementById('screen-progress').classList.toggle('active', tab==='progress');
    if(tab==='progress') renderProgress();
  });
});

document.getElementById('cal-prev').addEventListener('click', ()=>{
  progressViewMonth.setMonth(progressViewMonth.getMonth()-1);
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', ()=>{
  const today = new Date();
  const isCurrentMonth = (progressViewMonth.getFullYear()===today.getFullYear() && progressViewMonth.getMonth()===today.getMonth());
  if(isCurrentMonth) return;
  progressViewMonth.setMonth(progressViewMonth.getMonth()+1);
  renderCalendar();
});

/* ============ INIT ============ */
renderToday();
</script>
</body>
